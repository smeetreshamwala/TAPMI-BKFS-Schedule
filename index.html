<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAPMI BKFS 25-27 | Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="site-shell login-shell">
      <section class="hero panel login-panel">
        <div>
          <p class="eyebrow">Student Login</p>
          <h1>TAPMI BKFS 25-27</h1>
          <p class="hero-copy">Enter your code to open your schedule.</p>
        </div>
        <div class="login-form-wrap">
          <form id="login-form" class="login-form" novalidate>
            <label class="field" for="student-code-input">
              <span>Student code</span>
              <input id="student-code-input" name="studentCode" type="text" inputmode="text" autocomplete="off" placeholder="25B###" maxlength="6" />
            </label>
            <button class="button primary" type="submit">Open My Schedule</button>
            <p class="form-error" id="login-error" role="alert" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="students-data.js"></script>
    <script src="site-common.js"></script>
    <script src="login.js"></script>
  </body>
  </html>
